name: Setup
description: Set up CI prerequisites and release metadata

inputs:
  snapshot:
    description: Whether the current flow is the snapshot lane
    required: true

outputs:
  version:
    description: Project version from Gradle properties
    value: ${{ steps.extract-version.outputs.version }}
  minecraft_version:
    description: Minecraft version from gradle.properties
    value: ${{ steps.extract-version.outputs.minecraft_version }}
  changelog:
    description: Generated changelog body
    value: ${{ steps.generate-changelog.outputs.changelog }}

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Cache Gradle Packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Extract Version
      id: extract-version
      shell: bash
      run: |
        echo "version=$(./gradlew properties --console=plain | grep 'version:' | sed 's/version:\s*//g')" >> "$GITHUB_OUTPUT"
        echo "minecraft_version=$(grep 'minecraftVersion=' gradle.properties | sed 's/minecraftVersion=//g')" >> "$GITHUB_OUTPUT"

    - name: Generate Changelog
      id: generate-changelog
      uses: dsx137/generate-changelog@main
      with:
        include: ${{ inputs.snapshot == 'true' && 'snapshot' || '.*' }}
        exclude: ${{ inputs.snapshot == 'true' && '(^$).' || 'snapshot' }}
