name: stable

on:
  push:
    branches:
      - mc*/release
  pull_request:
    branches:
      - mc*/release
jobs:
  publish:
    concurrency:
      group: stable
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 21

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew runData
          ./gradlew build

      - name: Extract Version
        id: get_version
        run: echo "version=$(./gradlew properties --console=plain | grep 'version:'  | sed 's/version:\s*//g')" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: get_changelog
        run: |
          tag="$(git --no-pager tag --sort=creatordate --merged ${{ github.ref_name }} | grep -v snapshot | tail -1)"
          limit="-1"
          if [ -n "$tag" ]; then
            limit="$tag..HEAD"
          fi
          changelog="$(echo -ne "$(git log "$limit" --pretty=format:'- %s')")"
          changelog="$(echo -e "$changelog" | sed 's/$/  /')"
          echo "changelog=$changelog">> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          prerelease: false
          body: ${{ steps.get_changelog.outputs.changelog }}
          files: build/libs/lavafishing-${{ steps.get_version.outputs.version }}-all.jar

      - name: Modrinth Release
        uses: dsx137/modrinth-releaser@main
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          name: ${{ steps.get_version.outputs.version }}
          project_id: puTJzCb0
          loaders: neoforge
          game_versions: 1.21.1
          version_number: ${{ steps.get_version.outputs.version }}
          changelog: ${{ steps.get_changelog.outputs.changelog }}
          version_type: release
          files: build/libs/lavafishing-${{ steps.get_version.outputs.version }}-all.jar
          dependencies: Vl1uNAuy:required, ordsPcFz:required

      - name: CurseForge Release
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          game_endpoint: minecraft
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          display_name: ${{ steps.get_version.outputs.version }}
          project_id: 1035887
          game_versions: 11779,NeoForge,Java 21,Client,Server
          changelog: ${{ steps.get_changelog.outputs.changelog }}
          release_type: release
          file_path: build/libs/lavafishing-${{ steps.get_version.outputs.version }}-all.jar
          relations: aquaculture:requiredDependency,kotlin-for-forge:requiredDependency
